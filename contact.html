<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythgard Studios | Contact</title>
  <link href="Stylesheet_1.css" rel="stylesheet">
  <link href="Stylesheet_2.css" rel="stylesheet">
</head>

<body>
  <header class="navbar">
    <div class="navbar-inner">

      <div class="navbar-left">
        <div class="navbar-logo">
          <a href='/'>
            <img src="mythgard_studios_logo.png" alt="Mythgard Studios Logo">
          </a>
        </div>


        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
          <img src="navicon.png" alt="Menu Icon">
        </label>


        <nav class="navbar-links">
          <a href='/games'>Games</a>
          <a href='/developers'>Developers</a>
          <a href='/contact'>Contact</a>
        </nav>
      </div>


      <div class="navbar-right">
        <div class="tooltip-container">
          <a href="https://discord.gg/CVDYRVY9rH" class="btn-cta" aria-label="Join us on Discord">
            <img src="discord.svg" alt="Discord" class="icon-discord">
          </a>
          <span class="tooltip-text">Join our Discord</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="contact-form">
      <h1>Contact Mythgard Studios</h1>
      <p>We're open to player feedback, partnerships, press inquiries, and publishing opportunities. Reach out below!
      </p>

      <form action="https://example.com/submit-form" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Mythgard Studios LLC. All rights reserved.</p>
    <p>
      <a href="mailto:contact@mythgardstudios.com">contact@mythgardstudios.com</a>
    </p>
  </footer>
</body>

</html>
